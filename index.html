<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RRJ-95 Limitations</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f3; --line:#d9dde3;
  --text:#16191d; --muted:#5d6670; --accent:#1f5fbf; --accent-soft:#e3ecfa;
  --ok:#1d7a46; --ok-soft:#e1f3e8; --bad:#b3261e; --bad-soft:#fbe5e3;
  --warn:#8a5a00; --warn-soft:#fbefd6;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --surface:#1a1e24; --surface-2:#232830; --line:#30363f;
    --text:#e8eaed; --muted:#9aa3ad; --accent:#7fb0ff; --accent-soft:#1e2c44;
    --ok:#5cc98a; --ok-soft:#173326; --bad:#ff8a80; --bad-soft:#3a1d1b;
    --warn:#f0c060; --warn-soft:#3a2f17;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1a1e24; --surface-2:#232830; --line:#30363f;
  --text:#e8eaed; --muted:#9aa3ad; --accent:#7fb0ff; --accent-soft:#1e2c44;
  --ok:#5cc98a; --ok-soft:#173326; --bad:#ff8a80; --bad-soft:#3a1d1b;
  --warn:#f0c060; --warn-soft:#3a2f17;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 80px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
header h1 small{color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;margin-left:auto}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:550}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{color:var(--muted);font-size:13px;min-width:62px}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:550}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0b1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0b1220}}
.btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.small{padding:4px 9px;font-size:12px;border-radius:7px}
.muted{color:var(--muted)}
.sec{display:inline-block;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;font-weight:600}
/* flashcards */
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.card{perspective:1200px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.card-in{position:relative;min-height:260px;transition:transform .35s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.face.back{transform:rotateY(180deg)}
.face .grp{color:var(--muted);font-size:13px}
.face .q{font-size:20px;font-weight:600;margin:auto 0;text-align:center}
.face .a{margin:auto 0;text-align:center;font-size:24px;font-weight:700}
.face .a .v{display:flex;justify-content:center;gap:10px;align-items:baseline;font-size:21px;margin:6px 0}
.face .a .v span{font-size:13px;color:var(--muted);font-weight:600;min-width:90px;text-align:right}
.face .note{font-size:13px;color:var(--warn);text-align:center}
.face .hint{font-size:12px;color:var(--muted);text-align:center}
.cardbar{display:flex;gap:10px;margin-top:14px}
.cardbar .btn{flex:1;padding:12px}
.counts{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:10px;justify-content:center}
.done{text-align:center;padding:30px 10px}
.done h2{margin:0 0 6px}
/* fill-in */
.fill h2{font-size:18px;margin:0 0 4px}
.fill h3{font-size:14px;margin:18px 0 6px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px}
.fi{display:grid;grid-template-columns:1fr minmax(150px,240px);gap:8px 12px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.fi:last-child{border-bottom:0}
.fi .l{padding-top:7px}
.fi .ins{display:flex;flex-direction:column;gap:6px}
.inp{display:flex;flex-direction:column;gap:3px}
.inp label{font-size:11px;color:var(--muted);font-weight:600}
.inp input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px}
.inp input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.inp.ok input{border-color:var(--ok);background:var(--ok-soft)}
.inp.bad input{border-color:var(--bad);background:var(--bad-soft)}
.inp.self input{border-color:var(--warn);background:var(--warn-soft)}
.inp .res{font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.inp.ok .res{color:var(--ok)}
.inp.bad .res{color:var(--bad)}
.inp.self .res{color:var(--warn)}
.fi .nt{grid-column:1/-1;font-size:12.5px;color:var(--warn);margin-top:-2px}
.score{position:sticky;bottom:10px;margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.score b{font-size:17px}
@media (max-width:560px){
  .fi{grid-template-columns:1fr}
  .fi .l{padding-top:0}
  .tabs{margin-left:0;width:100%}
  .tabs button{flex:1}
  .face .q{font-size:18px}
}
/* reference */
.ref h2{font-size:16px;margin:22px 0 6px}
.ref h2:first-child{margin-top:0}
.ref h3{font-size:14px;margin:12px 0 4px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
td{border-bottom:1px solid var(--line);padding:6px 6px;vertical-align:top}
td:first-child{width:58%}
td b{white-space:nowrap}
td .vv{display:block}
td .vv small{color:var(--muted);font-weight:600;margin-right:4px}
td .n{display:block;font-size:12px;color:var(--warn)}
.src{font-size:12px;color:var(--muted)}
.unv{color:var(--warn);font-weight:600}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem('rrj95:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('rrj95:'+k, JSON.stringify(v)); }catch(e){} }
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.random()*(i+1)|0; [a[i],a[j]] = [a[j],a[i]]; } return a; };

// разворачиваем пункты в плоский список
const ITEMS = [];
GROUPS.forEach(g => g.items.forEach((it, i) => {
  const [q, a, o = {}] = it;
  ITEMS.push({ id: g.id + ':' + i, g, q, a, o, raw: it });
}));

/* --- проверка ответа --- */
function nums(s){
  s = String(s).replace(/,/g, '.').replace(/[−–—]/g, m => m);
  const out = [];
  const re = /(\d{1,3}(?:[  ]\d{3})+|\d+)(?:\.(\d+))?/g;
  let m;
  while ((m = re.exec(s))){
    let v = parseFloat(m[1].replace(/[  ]/g, '') + (m[2] ? '.' + m[2] : ''));
    const prev = s[m.index - 1];
    if (prev && /[-−–]/.test(prev) && !/\d/.test(s[m.index - 2] || '')) v = -v;
    out.push(v);
  }
  return out;
}
const norm = s => String(s).toLowerCase().replace(/ё/g,'е').replace(/[\s.,;:()'"«»]/g,'');

function check(expected, input, o){
  input = String(input || '').trim();
  if (!input) return 'bad';
  if (o.self) return 'self';
  if (o.k) { const n = norm(input); return o.k.some(k => n.includes(norm(k))) ? 'ok' : 'bad'; }
  const e = nums(expected);
  if (!e.length) return norm(input) === norm(expected) ? 'ok' : 'self';
  const g = nums(input);
  if (g.length !== e.length) return 'bad';
  // знак минус обязателен для отрицательных значений; лишний «–» перед положительным
  // числом прощаем (это обычно тире диапазона: «1800 - 3200»)
  return e.every((v, i) => Math.abs(v - g[i]) < 1e-9 || (v > 0 && Math.abs(v + g[i]) < 1e-9)) ? 'ok' : 'bad';
}

/* ============================================================
   СОСТОЯНИЕ И ФИЛЬТРЫ
   ============================================================ */
const state = {
  tab: store.get('tab', 'cards'),
  sec: store.get('sec', 'all'),
  tag: store.get('tag', null),
  src: store.get('src', 'fcom'),
};
const SRC = { fcom:'FCOM 1.02', ext:'SOP, РПП, системы', all:'Все' };
const inSrc = g => state.src === 'all' || g.src === state.src;
// источник пункта для подписи; ⚠ — значение не найдено в документах
const srcOf = (g, o) => (o.s || g.ref || (g.src === 'fcom' ? 'FCOM ' + g.sec.replace(/^02/, '1.02') : ''));
const srcHTML = (g, o) => { const s = srcOf(g, o); return (s ? `<span class="src">${esc(s)}</span>` : '') + (o.u ? ' <span class="unv" title="В документах не найдено — проверьте">⚠ не подтверждено</span>' : ''); };
// пункт попадает в тему, если тег стоит на группе или на самом пункте (опция t)
const inTag = (g, it) => !state.tag || g.tags.includes(state.tag) || ((it[2] || {}).t || []).includes(state.tag);
const itemsOf = g => g.items.filter(it => inTag(g, it));
function scopeGroups(){
  return GROUPS.filter(g => inSrc(g) && (state.sec === 'all' || g.sec === state.sec) && itemsOf(g).length);
}
function scopeItems(){
  return ITEMS.filter(it => inSrc(it.g) && (state.sec === 'all' || it.g.sec === state.sec) && inTag(it.g, it.raw));
}

function renderFilters(){
  const srow = $('#srcRow');
  srow.querySelectorAll('.chip').forEach(c => c.remove());
  Object.entries(SRC).forEach(([k, v]) => {
    const b = document.createElement('button');
    b.className = 'chip' + (state.src === k ? ' on' : '');
    b.textContent = v;
    b.onclick = () => { state.src = k; store.set('src', k); renderFilters(); rerender(); };
    srow.appendChild(b);
  });
  const secs = [...new Set(GROUPS.filter(inSrc).map(g => g.sec))];
  if (state.sec !== 'all' && !secs.includes(state.sec)){ state.sec = 'all'; store.set('sec', 'all'); }
  const sel = $('#secSel');
  sel.innerHTML = '<option value="all">Все разделы</option>' +
    secs.map(k => `<option value="${k}">${k} ${esc(SECTIONS[k])}</option>`).join('');
  sel.value = state.sec;
  sel.onchange = () => { state.sec = sel.value; store.set('sec', state.sec); rerender(); };
  const row = $('#tagRow');
  row.querySelectorAll('.chip').forEach(c => c.remove());
  const mk = (key, label) => {
    const b = document.createElement('button');
    b.className = 'chip' + (state.tag === key ? ' on' : '');
    b.textContent = label;
    b.onclick = () => { state.tag = state.tag === key ? null : key; store.set('tag', state.tag); renderFilters(); rerender(); };
    row.appendChild(b);
  };
  Object.entries(TAGS).forEach(([k, v]) => mk(k, v));
}

function renderTabs(){
  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.tab === state.tab);
    b.onclick = () => { state.tab = b.dataset.tab; store.set('tab', state.tab); renderTabs(); rerender(); };
  });
}

function rerender(){
  if (state.tab === 'cards') Cards.start();
  else if (state.tab === 'fill') Fill.start();
  else Ref.render();
}

function answerHTML(a, cls = 'v'){
  if (typeof a !== 'object') return esc(a);
  return Object.entries(a).map(([k, v]) => `<div class="${cls}"><span>${esc(k)}</span>${esc(v)}</div>`).join('');
}

/* ============================================================
   КАРТОЧКИ
   ============================================================ */
const Cards = {
  start(){
    const known = store.get('known', {});
    let items = scopeItems();
    this.onlyNew = store.get('onlyNew', false);
    if (this.onlyNew) items = items.filter(it => !known[it.id]);
    this.queue = shuffle(items);
    this.total = this.queue.length;
    this.ok = 0; this.miss = 0; this.missed = [];
    this.render();
  },
  render(){
    const v = $('#view');
    const known = store.get('known', {});
    const scope = scopeItems();
    const learned = scope.filter(it => known[it.id]).length;
    const top = `<div class="row" style="justify-content:space-between;margin-bottom:6px">
      <span class="muted" style="font-size:13px">Выучено ${learned} из ${scope.length}</span>
      <span class="row">
        <button class="chip ${this.onlyNew ? 'on' : ''}" id="onlyNew">Только невыученные</button>
        <button class="chip" id="resetKnown">Сбросить</button>
      </span></div>`;
    if (!this.queue.length){
      v.innerHTML = top + `<div class="panel done">
        <h2>${this.total ? 'Колода пройдена' : 'Карточек нет'}</h2>
        <p class="muted">${this.total ? `Знал: ${this.ok} · Не знал: ${this.miss}` : 'Измените фильтр раздела или темы.'}</p>
        <div class="row" style="justify-content:center">
          ${this.missed.length ? '<button class="btn primary" id="again">Повторить невыученные</button>' : ''}
          <button class="btn" id="restart">Начать заново</button>
        </div></div>`;
      $('#again') && ($('#again').onclick = () => { this.queue = shuffle(this.missed); this.total = this.queue.length; this.ok = this.miss = 0; this.missed = []; this.render(); });
      $('#restart').onclick = () => this.start();
      this.bindTop();
      return;
    }
    const it = this.queue[0];
    const done = this.total - this.queue.length;
    v.innerHTML = top + `
      <div class="progress"><i style="width:${done / this.total * 100}%"></i></div>
      <div class="card" id="card"><div class="card-in">
        <div class="face front">
          <div><span class="sec">${it.g.sec}</span> <span class="grp">${esc(it.g.title)}</span></div>
          <div class="q">${esc(it.q)}</div>
          <div class="hint">${srcHTML(it.g, it.o)}</div>
          <div class="hint">Нажмите или <kbd>Пробел</kbd>, чтобы перевернуть</div>
        </div>
        <div class="face back">
          <div><span class="sec">${it.g.sec}</span> <span class="grp">${esc(it.q)}</span></div>
          <div class="a">${answerHTML(it.a)}</div>
          ${it.o.n ? `<div class="note">${esc(it.o.n)}</div>` : ''}
          <div class="hint">${srcHTML(it.g, it.o)}</div>
        </div>
      </div></div>
      <div class="cardbar">
        <button class="btn bad" id="no">Не знаю <kbd>1</kbd></button>
        <button class="btn ok" id="yes">Знаю <kbd>2</kbd></button>
      </div>
      <div class="counts"><span>Осталось: ${this.queue.length}</span><span>Знал: ${this.ok}</span><span>Не знал: ${this.miss}</span></div>`;
    $('#card').onclick = () => $('#card').classList.toggle('flip');
    $('#yes').onclick = () => this.mark(true);
    $('#no').onclick = () => this.mark(false);
    this.bindTop();
  },
  bindTop(){
    $('#onlyNew').onclick = () => { store.set('onlyNew', !this.onlyNew); this.start(); };
    $('#resetKnown').onclick = () => { if (confirm('Сбросить отметки «выучено»?')){ store.set('known', {}); this.start(); } };
  },
  mark(knew){
    const it = this.queue.shift();
    const known = store.get('known', {});
    if (knew){ this.ok++; known[it.id] = 1; }
    else {
      this.miss++; delete known[it.id];
      if (!this.missed.includes(it)) this.missed.push(it);
      // вернуть карточку в колоду через несколько позиций
      this.queue.splice(Math.min(this.queue.length, 4 + (Math.random() * 3 | 0)), 0, it);
      this.total++;
    }
    store.set('known', known);
    this.render();
  },
  key(e){
    if (!$('#card')) return;
    if (e.code === 'Space'){ e.preventDefault(); $('#card').classList.toggle('flip'); }
    else if (e.key === '1') this.mark(false);
    else if (e.key === '2') this.mark(true);
  }
};

/* ============================================================
   ПОДСТАНОВКА
   ============================================================ */
const Fill = {
  start(){
    const groups = scopeGroups();
    const v = $('#view');
    if (!groups.length){ v.innerHTML = '<div class="panel done"><h2>Нет вопросов</h2><p class="muted">Измените фильтр.</p></div>'; return; }
    const opts = [];
    if (state.tag) opts.push(`<option value="__tag">Все: ${esc(TAGS[state.tag])}${state.sec !== 'all' ? ' · ' + state.sec : ''} (${scopeItems().length})</option>`);
    else if (state.sec !== 'all') opts.push(`<option value="__tag">Весь раздел ${state.sec} (${scopeItems().length})</option>`);
    groups.forEach(g => opts.push(`<option value="${g.id}">${g.sec} · ${esc(g.title)} (${itemsOf(g).length})</option>`));
    if (!this.choice || !(this.choice === '__tag' ? (state.tag || state.sec !== 'all') : groups.some(g => g.id === this.choice)))
      this.choice = (state.tag || state.sec !== 'all') ? '__tag' : groups[0].id;
    v.innerHTML = `<div class="panel fill">
      <div class="row" style="margin-bottom:6px">
        <select id="grpSel" style="flex:1;min-width:0">${opts.join('')}</select>
        <button class="btn" id="rnd" title="Случайная группа">Случайная</button>
      </div>
      <div id="form"></div></div>`;
    $('#grpSel').value = this.choice;
    $('#grpSel').onchange = e => { this.choice = e.target.value; this.renderForm(); };
    $('#rnd').onclick = () => { const g = groups[Math.random() * groups.length | 0]; this.choice = g.id; $('#grpSel').value = g.id; this.renderForm(); };
    this.renderForm();
  },
  renderForm(){
    const groups = this.choice === '__tag' ? scopeGroups() : GROUPS.filter(g => g.id === this.choice);
    const multi = groups.length > 1;
    const title = multi ? ($('#grpSel').selectedOptions[0].textContent.replace(/\s*\(\d+\)$/, '')) : groups[0].title;
    this.fields = [];
    let html = `<h2>${esc(title)}</h2><p class="muted" style="margin:0 0 6px;font-size:13px">Впишите значения. Единицы можно не писать. <kbd>Enter</kbd> — следующее поле.</p>`;
    groups.forEach(g => {
      if (multi) html += `<h3>${g.sec} · ${esc(g.title)}</h3>`;
      if (g.ref || g.src === 'fcom') html += `<div class="src" style="margin:${multi ? '-2px 0 4px' : '0 0 6px'}">Источник: ${esc(g.ref || 'FCOM ' + g.sec.replace(/^02/, '1.02'))}</div>`;
      itemsOf(g).forEach(it => {
        const [q, a, o = {}] = it;
        const vars = typeof a === 'object' ? Object.entries(a) : [[null, a]];
        html += `<div class="fi"><div class="l">${esc(q)}${o.s || o.u ? '<br>' + srcHTML({}, o) : ''}</div><div class="ins">`;
        vars.forEach(([lab, ans]) => {
          const fid = 'f' + this.fields.length;
          this.fields.push({ fid, ans, o });
          html += `<div class="inp" id="${fid}">${lab ? `<label>${esc(lab)}</label>` : ''}<input autocomplete="off" spellcheck="false" inputmode="text"><div class="res"></div></div>`;
        });
        html += `</div>${o.n ? `<div class="nt" hidden>${esc(o.n)}</div>` : ''}</div>`;
      });
    });
    html += `<div class="score" id="score"><button class="btn primary" id="chk">Проверить</button><button class="btn" id="clr">Очистить</button><span id="sc"></span></div>`;
    $('#form').innerHTML = html;
    const inputs = [...document.querySelectorAll('#form input')];
    inputs.forEach((inp, i) => inp.addEventListener('keydown', e => {
      if (e.key === 'Enter'){ e.preventDefault(); if (inputs[i + 1]) inputs[i + 1].focus(); else this.check(); }
    }));
    $('#chk').onclick = () => this.check();
    $('#clr').onclick = () => this.renderForm();
    if (window.matchMedia('(pointer:fine)').matches && inputs[0]) inputs[0].focus();
  },
  check(){
    this.fields.forEach(f => {
      const box = document.getElementById(f.fid);
      const val = box.querySelector('input').value;
      f.res = check(f.ans, val, f.o);
      box.className = 'inp ' + f.res;
      const r = box.querySelector('.res');
      if (f.res === 'ok') r.innerHTML = `✓ ${esc(f.ans)}`;
      else if (f.res === 'bad') r.innerHTML = `✗ ${esc(f.ans)} <button class="btn small" data-a="ok">засчитать</button>`;
      else r.innerHTML = `Сверьте: ${esc(f.ans)} <button class="btn small" data-a="ok">верно</button><button class="btn small" data-a="bad">неверно</button>`;
      r.querySelectorAll('button').forEach(b => b.onclick = () => {
        f.res = b.dataset.a; box.className = 'inp ' + f.res;
        r.innerHTML = (f.res === 'ok' ? '✓ ' : '✗ ') + esc(f.ans);
        this.score();
      });
    });
    document.querySelectorAll('#form .nt').forEach(n => n.hidden = false);
    this.score();
  },
  score(){
    const ok = this.fields.filter(f => f.res === 'ok').length;
    const pending = this.fields.filter(f => f.res === 'self').length;
    $('#sc').innerHTML = `<b>${ok} / ${this.fields.length}</b>` + (pending ? ` <span class="muted">· сверить: ${pending}</span>` : '');
  }
};

/* ============================================================
   ШПАРГАЛКА
   ============================================================ */
const Ref = {
  render(){
    const groups = scopeGroups();
    let html = '<div class="panel ref">';
    let lastSec = null;
    groups.forEach(g => {
      if (g.sec !== lastSec){ html += `<h2>${g.sec} ${esc(SECTIONS[g.sec])}</h2>`; lastSec = g.sec; }
      html += `<h3>${esc(g.title)} <span class="src">· ${esc(g.ref || 'FCOM ' + g.sec.replace(/^02/, '1.02'))}</span></h3><table>`;
      itemsOf(g).forEach(([q, a, o = {}]) => {
        const ans = typeof a === 'object'
          ? Object.entries(a).map(([k, v]) => `<span class="vv"><small>${esc(k)}</small><b>${esc(v)}</b></span>`).join('')
          : `<b>${esc(a)}</b>`;
        html += `<tr><td>${esc(q)}${o.s || o.u ? '<br>' + srcHTML({}, o) : ''}</td><td>${ans}${o.n ? `<span class="n">${esc(o.n)}</span>` : ''}</td></tr>`;
      });
      html += '</table>';
    });
    if (!groups.length) html += '<p class="muted">Нет данных для выбранного фильтра.</p>';
    $('#view').innerHTML = html + '</div>';
  }
};

document.addEventListener('keydown', e => { if (state.tab === 'cards' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') Cards.key(e); });
renderTabs(); renderFilters(); rerender();
</script>
