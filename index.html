<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RRJ-95 Limits</title>
<style>
:root{
  --bg:#ffffff; --soft:#f4f4f2; --line:#d6d6d3; --text:#1a1a1a; --muted:#6b6b68;
  --primary:#1a1a1a; --on-primary:#ffffff;
  --ok:#1d7a46; --ok-soft:#e3f3e9; --bad:#b3261e; --bad-soft:#fbe6e4; --warn:#8a5a00; --warn-soft:#fbf0d9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --soft:#202020; --line:#363636; --text:#ececea; --muted:#9a9a96;
    --primary:#ececea; --on-primary:#141414;
    --ok:#5cc98a; --ok-soft:#173326; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f0c060; --warn-soft:#3a2f17;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --soft:#202020; --line:#363636; --text:#ececea; --muted:#9a9a96;
  --primary:#ececea; --on-primary:#141414;
  --ok:#5cc98a; --ok-soft:#173326; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f0c060; --warn-soft:#3a2f17;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
#app{max-width:440px;margin:0 auto;padding:20px 16px 40px}
.screen{display:none}
.screen.active{display:block}

/* home */
.home-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.home-title{font-size:26px;font-weight:700;margin:2px 0 16px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:8px 4px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.scope{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.stat{background:var(--soft);border-radius:10px;padding:12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12.5px;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:10px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:15px 16px;cursor:pointer}
.menu button.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.menu button i{font-style:normal;width:22px;text-align:center}
.menu button em{font-style:normal;margin-left:auto;color:var(--muted)}
.menu button.primary em{color:inherit;opacity:.6}
.menu .sep{height:6px}

/* quiz */
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.x{border:0;background:var(--soft);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1;color:var(--muted)}
.count{font-weight:600;color:var(--muted);font-size:14px}
.tag{margin-left:auto;font-size:12px;color:var(--muted);background:var(--soft);border-radius:99px;padding:3px 10px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:3px;background:var(--soft);border-radius:3px;margin-bottom:18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);transition:width .2s}
.qtext{font-size:19px;font-weight:650;margin:0 0 16px}
.qsub{font-size:13px;color:var(--muted);margin:-10px 0 14px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:13px 16px;margin-bottom:10px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
.field input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;font-size:17px}
.field input:focus{outline:2px solid var(--primary);outline-offset:-1px}
.field.ok input{border-color:var(--ok);background:var(--ok-soft)}
.field.bad input{border-color:var(--bad);background:var(--bad-soft)}
.field.self input{border-color:var(--warn);background:var(--warn-soft)}
.field .res{font-size:13px;margin-top:3px}
.field.ok .res{color:var(--ok)} .field.bad .res{color:var(--bad)} .field.self .res{color:var(--warn)}
.grow{padding:10px 0;border-bottom:1px dashed var(--line)}
.grow .gl{font-size:15px;margin-bottom:6px}
.gh{font-size:13px;color:var(--muted);font-weight:600;margin:16px 0 2px}
.fb{border-radius:10px;padding:12px 14px;margin:6px 0 12px;font-size:15px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.self{background:var(--warn-soft);color:var(--warn)}
.fb .ans{color:var(--text);font-weight:600}
.fb small{display:block;color:var(--muted);margin-top:4px;font-size:12.5px}
.fb .lnk{border:0;background:none;color:inherit;text-decoration:underline;padding:0;cursor:pointer;font-size:13px;margin-left:6px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font-weight:650;cursor:pointer;background:var(--primary);color:var(--on-primary);margin-top:6px}
.btn.ghost{background:var(--soft);color:var(--text)}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}
.kp{display:none;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.kp.on{display:grid}
.kp button{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:14px 0;font-size:20px;font-weight:600;cursor:pointer}
.kp button.act{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-size:16px}
.unv{color:var(--warn)}

/* cards */
.card{perspective:1200px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;margin-bottom:14px}
.card-in{position:relative;min-height:280px;transition:transform .35s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:18px;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg);background:var(--soft)}
.face .q{margin:auto 0;text-align:center;font-size:19px;font-weight:650}
.face .a{margin:auto 0;text-align:center;font-size:24px;font-weight:700}
.face .a .v{font-size:19px;margin:4px 0}
.face .a .v span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.face .s{font-size:12px;color:var(--muted);text-align:center}
.face .n{font-size:13px;color:var(--warn);text-align:center;margin-bottom:6px}

/* result */
.res-wrap{text-align:center;padding-top:40px}
.res-score{font-size:56px;font-weight:700;margin:6px 0}
.res-pct{color:var(--muted);margin-bottom:6px}
.res-comment{margin-bottom:28px}

/* reference */
.ref h2{font-size:17px;margin:22px 0 4px}
.ref h3{font-size:13px;color:var(--muted);margin:14px 0 4px;font-weight:600}
.ref table{width:100%;border-collapse:collapse;font-size:14px}
.ref td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
.ref td:last-child{text-align:right;font-weight:600;white-space:nowrap}
.ref td small{display:block;font-weight:400;color:var(--warn);white-space:normal}
.ref td .vv{display:block}
.ref td .vv span{color:var(--muted);font-weight:400;font-size:12px;margin-right:4px}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div id="home" class="screen active">
  <div class="home-label">Тест по ограничениям</div>
  <div class="home-title">RRJ-95 Limits</div>
  <div class="seg" id="srcSeg"></div>
  <select class="scope" id="scope"></select>
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b><span>вопросов</span></div>
    <div class="stat"><b id="stBest">—</b><span>лучший результат</span></div>
    <div class="stat"><b id="stWeak">0</b><span>слабых карточек</span></div>
  </div>
  <div class="menu" id="menu"></div>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="top">
    <button class="x" onclick="go('home')" title="На главную">×</button>
    <span class="count" id="qCount"></span>
    <span class="tag" id="qTag"></span>
  </div>
  <div class="bar"><i id="qBar"></i></div>
  <div id="qBody"></div>
</div>

<!-- CARDS -->
<div id="cards" class="screen">
  <div class="top">
    <button class="x" onclick="go('home')" title="На главную">×</button>
    <span class="count" id="cCount"></span>
    <span class="tag" id="cTag"></span>
  </div>
  <div class="bar"><i id="cBar"></i></div>
  <div id="cBody"></div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="res-wrap">
    <div class="home-label">Результат</div>
    <div class="res-score" id="rScore"></div>
    <div class="res-pct" id="rPct"></div>
    <div class="res-comment" id="rComment"></div>
    <div class="menu" id="rMenu"></div>
  </div>
</div>

<!-- REFERENCE -->
<div id="ref" class="screen">
  <div class="top">
    <button class="x" onclick="go('home')" title="На главную">×</button>
    <span class="count">Шпаргалка</span>
    <span class="tag" id="refTag"></span>
  </div>
  <div class="ref" id="refBody"></div>
</div>

</div>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem('rrj95:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('rrj95:'+k, JSON.stringify(v)); }catch(e){} }
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.random()*(i+1)|0; [a[i],a[j]] = [a[j],a[i]]; } return a; };
const touch = window.matchMedia('(pointer: coarse)').matches;

const ITEMS = [];
GROUPS.forEach(g => g.items.forEach((it, i) => {
  const [q, a, o = {}] = it;
  ITEMS.push({ id: g.id + ':' + i, g, q, a, o });
}));

/* --- проверка ответа --- */
function nums(s){
  s = String(s).replace(/,/g, '.');
  const out = [], re = /(\d{1,3}(?:[  ]\d{3})+|\d+)(?:\.(\d+))?/g;
  let m;
  while ((m = re.exec(s))){
    let v = parseFloat(m[1].replace(/[  ]/g, '') + (m[2] ? '.' + m[2] : ''));
    const prev = s[m.index - 1];
    if (prev && /[-−–]/.test(prev) && !/\d/.test(s[m.index - 2] || '')) v = -v;
    out.push(v);
  }
  return out;
}
const norm = s => String(s).toLowerCase().replace(/ё/g,'е').replace(/[\s.,;:()'"«»]/g,'');
function check(expected, input, o){
  input = String(input || '').trim();
  if (!input) return 'bad';
  if (o.self) return 'self';
  if (o.k) { const n = norm(input); return o.k.some(k => n.includes(norm(k))) ? 'ok' : 'bad'; }
  const e = nums(expected);
  if (!e.length) return norm(input) === norm(expected) ? 'ok' : 'self';
  const g = nums(input);
  if (g.length !== e.length) return 'bad';
  // минус обязателен для отрицательных; лишний «–» перед положительным прощаем (тире диапазона)
  return e.every((v, i) => Math.abs(v - g[i]) < 1e-9 || (v > 0 && Math.abs(v + g[i]) < 1e-9)) ? 'ok' : 'bad';
}
const numeric = (a, o) => !o.k && !o.self && nums(a).length > 0;
const secLabel = g => g.src === 'fcom' ? 'FCOM ' + g.sec.replace(/^02/, '1.02') : g.sec;
const srcOf = (g, o) => o.s || g.ref || secLabel(g);
const ansText = a => typeof a === 'object' ? Object.entries(a).map(([k, v]) => `${k}: ${v}`).join(' · ') : a;

/* ============================================================
   ФИЛЬТР: источник + тема/раздел
   ============================================================ */
const SRC = { fcom:'FCOM 1.02', ext:'SOP и РПП', all:'Все' };
const state = { src: store.get('src', 'fcom'), scope: store.get('scope', 'all') };
const inSrc = g => state.src === 'all' || g.src === state.src;
function inScope(g, raw){
  const [kind, val] = state.scope.split(':');
  if (kind === 'sec') return g.sec === val;
  if (kind === 'tag') return g.tags.includes(val) || ((raw[2] || {}).t || []).includes(val);
  return true;
}
const itemsOf = g => g.items.filter(r => inScope(g, r));
const scopeGroups = () => GROUPS.filter(g => inSrc(g) && itemsOf(g).length);
const scopeItems = () => ITEMS.filter(it => inSrc(it.g) && inScope(it.g, [it.q, it.a, it.o]));
const scopeName = () => {
  const [kind, val] = state.scope.split(':');
  if (kind === 'tag') return TAGS[val];
  if (kind === 'sec') return val + ' ' + SECTIONS[val];
  return 'Все темы';
};
const scopeKey = () => state.src + '|' + state.scope;

/* слабые карточки — как в старой версии: ошибка +1, верный ответ −1 */
let weak = store.get('weak', {});
const weakItems = () => scopeItems().filter(it => weak[it.id] > 0);
function record(it, ok){
  if (!ok) weak[it.id] = (weak[it.id] || 0) + 1;
  else if (weak[it.id] > 0 && !session.missed.has(it.id)){ weak[it.id]--; if (weak[it.id] <= 0) delete weak[it.id]; }
  if (!ok) session.missed.add(it.id);
  store.set('weak', weak);
}

function go(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  window.scrollTo(0, 0);
  if (id === 'home') renderHome();
}

function renderHome(){
  $('#srcSeg').innerHTML = Object.entries(SRC).map(([k, v]) =>
    `<button class="${state.src === k ? 'on' : ''}" onclick="setSrc('${k}')">${v}</button>`).join('');

  const groups = GROUPS.filter(inSrc);
  const tags = Object.keys(TAGS).filter(t => groups.some(g => g.tags.includes(t) || g.items.some(r => ((r[2] || {}).t || []).includes(t))));
  const secs = [...new Set(groups.map(g => g.sec))];
  if (!(state.scope === 'all' || tags.includes(state.scope.slice(4)) || secs.includes(state.scope.slice(4)))) state.scope = 'all';
  $('#scope').innerHTML = '<option value="all">Все темы</option>' +
    '<optgroup label="Темы">' + tags.map(t => `<option value="tag:${t}">${TAGS[t]}</option>`).join('') + '</optgroup>' +
    '<optgroup label="Разделы">' + secs.map(s => `<option value="sec:${s}">${s} ${esc(SECTIONS[s])}</option>`).join('') + '</optgroup>';
  $('#scope').value = state.scope;
  $('#scope').onchange = e => { state.scope = e.target.value; store.set('scope', state.scope); renderHome(); };

  const items = scopeItems(), nWeak = weakItems().length, best = store.get('best', {})[scopeKey()];
  $('#stTotal').textContent = items.length;
  $('#stBest').textContent = best != null ? best + '%' : '—';
  $('#stWeak').textContent = nWeak;

  const fillLabel = state.scope === 'all' ? 'Вписать по группам' : 'Вписать всё: ' + scopeName();
  $('#menu').innerHTML = `
    <button class="primary" onclick="startQuiz(10)"><i>▶</i> 10 случайных вопросов <em>›</em></button>
    <button onclick="startQuiz(20)"><i>▶</i> 20 вопросов <em>›</em></button>

    ${nWeak ? `<button onclick="startWeak()"><i>↺</i> Слабые карточки (${nWeak}) <em>›</em></button>` : ''}
    <div class="sep"></div>
    <button onclick="startCards()"><i>▢</i> Карточки <em>›</em></button>
    <button onclick="startFill()"><i>✎</i> ${esc(fillLabel)} <em>›</em></button>
    <button onclick="showRef()"><i>☰</i> Шпаргалка <em>›</em></button>`;
}
function setSrc(k){ state.src = k; store.set('src', k); renderHome(); }

   ============================================================ */
let session = { tasks: [], i: 0, ok: 0, total: 0, missed: new Set(), last: null };

function unitOf(a){ return typeof a === 'string' ? a.replace(/[−–-]?\d[\d\s.,]*/g, '#').replace(/\s+/g, ' ').trim() : null; }
function choicesFor(it){
  if (typeof it.a !== 'string' || nums(it.a).length !== 1 || it.o.k || it.o.self) return null;
  const u = unitOf(it.a), v = nums(it.a)[0];
  const pool = shuffle(ITEMS.filter(x => typeof x.a === 'string' && unitOf(x.a) === u && nums(x.a).length === 1 && nums(x.a)[0] !== v));
  const same = pool.filter(x => x.g.sec === it.g.sec), opts = [];
  for (const x of [...same, ...pool]) if (!opts.some(y => nums(y)[0] === nums(x.a)[0])) { opts.push(x.a); if (opts.length === 3) break; }
  return opts.length === 3 ? shuffle([it.a, ...opts]) : null;
}

function begin(tasks){
  session = { tasks, i: 0, ok: 0, total: 0, missed: new Set(), last: tasks };
  if (!tasks.length){ alert('Нет вопросов для выбранного фильтра'); return; }
  go('quiz'); renderTask();
}
function itemTasks(items){
  return items.map(it => { const c = Math.random() < 0.35 ? choicesFor(it) : null; return c ? { kind:'choice', it, opts:c } : { kind:'item', it }; });
}
function startQuiz(n){
  const items = scopeItems(), w = shuffle(items.filter(it => weak[it.id] > 0)), rest = shuffle(items.filter(it => !(weak[it.id] > 0)));
  const pick = n ? shuffle([...w, ...rest].slice(0, n)) : shuffle(items);
  begin(itemTasks(pick));
}
function startWeak(){ begin(itemTasks(shuffle(weakItems()))); }
function startFill(){
  const groups = scopeGroups();
  const tasks = state.scope === 'all'
    ? shuffle(groups).map(g => ({ kind:'group', title: g.title, parts:[{ g, rows: itemsOf(g) }] }))
    : [{ kind:'group', title: 'Впишите всё: ' + scopeName(), parts: groups.map(g => ({ g, rows: itemsOf(g) })) }];
  begin(tasks);
}

function fieldsHTML(a, o, id){
  const vars = typeof a === 'object' ? Object.entries(a) : [[null, a]];
  return vars.map(([lab, ans], j) => {
    const num = numeric(ans, o);
    return `<div class="field" data-id="${id}" data-j="${j}">${lab ? `<label>${esc(lab)}</label>` : ''}
      <input autocomplete="off" spellcheck="false" ${num && touch ? 'inputmode="none"' : ''} data-num="${num ? 1 : 0}"><div class="res"></div></div>`;
  }).join('');
}

function renderTask(){
  const t = session.tasks[session.i], n = session.tasks.length;
  $('#qCount').textContent = `${session.i + 1} / ${n}`;
  $('#qBar').style.width = (session.i / n * 100) + '%';
  let html = '';
  if (t.kind === 'group'){
    $('#qTag').textContent = t.parts.length > 1 ? scopeName() : t.parts[0].g.sec;
    html += `<p class="qtext">${esc(t.title)}</p>`;
    t.parts.forEach((p, pi) => {
      if (t.parts.length > 1) html += `<div class="gh">${esc(p.g.title)}</div>`;
      p.rows.forEach((r, ri) => {
        html += `<div class="grow"><div class="gl">${esc(r[0])}</div>${fieldsHTML(r[1], r[2] || {}, pi + '.' + ri)}</div>`;
      });
    });
    html += `<div class="fb" id="fb"></div><div id="act"><button class="btn" onclick="checkTask()">Проверить</button></div>`;
  } else {
    const it = t.it;
    $('#qTag').textContent = it.g.sec + ' · ' + it.g.title;
    html += `<p class="qtext">${esc(it.q)}</p><p class="qsub">${esc(it.g.title)}</p>`;
    if (t.kind === 'choice') html += t.opts.map((o, i) => `<button class="opt" onclick="pickChoice(${i})">${esc(o)}</button>`).join('');
    else html += fieldsHTML(it.a, it.o, 'x');
    html += `<div class="fb" id="fb"></div><div id="act">${t.kind === 'choice' ? '' : '<button class="btn" onclick="checkTask()">Проверить</button>'}</div>`;
  }
  html += `<div class="kp" id="kp">${['1','2','3','⌫','4','5','6','−','7','8','9','/','.','0','→','✓'].map(k =>
    `<button type="button" class="${k === '✓' ? 'act' : ''}" onmousedown="event.preventDefault()" onclick="kp('${k}')">${k}</button>`).join('')}</div>`;
  $('#qBody').innerHTML = html;
  const inputs = [...document.querySelectorAll('#qBody input')];
  inputs.forEach((inp, i) => {
    inp.addEventListener('focus', () => { kpTarget = inp; $('#kp').classList.toggle('on', touch && inp.dataset.num === '1'); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); if (inputs[i + 1] && !checked) inputs[i + 1].focus(); else enter(); } });
  });
  checked = false; kpTarget = inputs[0] || null;
  if (inputs[0]) inputs[0].focus({ preventScroll: true });
}

/* экранная клавиатура (на телефоне, для числовых ответов — есть минус) */
let kpTarget = null, checked = false;
function kp(k){
  if (k === '✓'){ enter(); return; }
  if (!kpTarget) return;
  if (k === '→'){ const ins = [...document.querySelectorAll('#qBody input')]; const nx = ins[ins.indexOf(kpTarget) + 1]; if (nx) nx.focus(); return; }
  if (k === '⌫') kpTarget.value = kpTarget.value.slice(0, -1);
  else kpTarget.value += (k === '−' ? '-' : k === '/' ? ' / ' : k);
}
function enter(){ if (checked === 'self') return; if (!checked) checkTask(); else next(); }

function showFb(cls, html){ const fb = $('#fb'); fb.className = 'fb show ' + cls; fb.innerHTML = html; }
function nextBtn(){ $('#act').innerHTML = `<button class="btn" onclick="next()">${session.i + 1 < session.tasks.length ? 'Далее →' : 'Результат →'}</button>`; $('#kp').classList.remove('on'); }
const meta = (g, o) => `${o.n ? `<small>${esc(o.n)}</small>` : ''}<small>Источник: ${esc(srcOf(g, o))}${o.u ? ' · <span class="unv">⚠ не подтверждено</span>' : ''}</small>`;

function pickChoice(i){
  if (checked) return;
  const t = session.tasks[session.i], ok = t.opts[i] === t.it.a;
  document.querySelectorAll('.opt').forEach((b, j) => { if (t.opts[j] === t.it.a) b.classList.add('ok'); else if (j === i) b.classList.add('bad'); });
  checked = true; session.total++; if (ok) session.ok++; record(t.it, ok);
  showFb(ok ? 'ok' : 'bad', (ok ? 'Верно' : 'Неверно') + meta(t.it.g, t.it.o));
  nextBtn();
}

function checkTask(){
  if (checked) return;
  const t = session.tasks[session.i];
  checked = true;
  if (t.kind === 'group'){
    let ok = 0, total = 0;
    const rowsOk = [];
    t.parts.forEach((p, pi) => p.rows.forEach((r, ri) => {
      const [, a, o = {}] = r, vars = typeof a === 'object' ? Object.values(a) : [a];
      let rowOk = true;
      vars.forEach((ans, j) => {
        const box = document.querySelector(`.field[data-id="${pi}.${ri}"][data-j="${j}"]`);
        const res = check(ans, box.querySelector('input').value, o);
        markField(box, res, ans, () => updateGroupScore());
        if (res !== 'ok') rowOk = false;
      });
      if (o.n) box_note(pi, ri, o.n);
      rowsOk.push({ g: p.g, i: p.g.items.indexOf(r) });
    }));
    t.rowsOk = rowsOk;
    updateGroupScore();
    nextBtn();
    return;
  }
  const it = t.it, vars = typeof it.a === 'object' ? Object.values(it.a) : [it.a];
  const res = vars.map((ans, j) => { const box = document.querySelector(`.field[data-j="${j}"]`); const r = check(ans, box.querySelector('input').value, it.o); markField(box, r, ans, null); return r; });
  if (res.includes('self')){
    showFb('self', `Сверьте ответ: <span class="ans">${esc(ansText(it.a))}</span>
      <button class="lnk" onclick="selfMark(true)">верно</button><button class="lnk" onclick="selfMark(false)">неверно</button>${meta(it.g, it.o)}`);
    checked = 'self'; $('#act').innerHTML = ''; $('#kp').classList.remove('on');
    return;
  }
  const ok = res.every(r => r === 'ok');
  finishItem(ok);
}
function finishItem(ok){
  const it = session.tasks[session.i].it;
  session.total++; if (ok) session.ok++; record(it, ok);
  showFb(ok ? 'ok' : 'bad', (ok ? 'Верно' : `Правильно: <span class="ans">${esc(ansText(it.a))}</span>
    <button class="lnk" onclick="override()">засчитать</button>`) + meta(it.g, it.o));
  nextBtn();
}
function selfMark(ok){ finishItem(ok); }
function override(){
  const it = session.tasks[session.i].it;
  session.ok++; session.missed.delete(it.id);
  if (weak[it.id] > 0){ weak[it.id]--; if (weak[it.id] <= 0) delete weak[it.id]; store.set('weak', weak); }
  showFb('ok', 'Засчитано' + meta(it.g, it.o));
}
function markField(box, res, ans, onChange){
  box.classList.remove('ok', 'bad', 'self'); box.classList.add(res); box.dataset.res = res;
  const r = box.querySelector('.res');
  if (res === 'ok') r.textContent = '✓ ' + ans;
  else {
    r.innerHTML = (res === 'bad' ? '✗ ' : 'Сверьте: ') + esc(ans) + (onChange ? ` <button class="lnk" style="color:inherit">${res === 'bad' ? 'засчитать' : 'верно'}</button>` : '');
    const b = r.querySelector('button');
    if (b) b.onclick = () => { box.classList.remove('bad', 'self'); box.classList.add('ok'); box.dataset.res = 'ok'; r.textContent = '✓ ' + ans; onChange(); };
  }
}
function box_note(pi, ri, n){
  const row = document.querySelector(`.field[data-id="${pi}.${ri}"]`).parentElement;
  if (!row.querySelector('.gn')) row.insertAdjacentHTML('beforeend', `<div class="gn" style="font-size:13px;color:var(--warn)">${esc(n)}</div>`);
}
function updateGroupScore(){
  const boxes = [...document.querySelectorAll('#qBody .field')];
  const ok = boxes.filter(b => b.dataset.res === 'ok').length;
  showFb(ok === boxes.length ? 'ok' : 'bad', `${ok} из ${boxes.length} верно`);
}
function next(){
  const t = session.tasks[session.i];
  if (t.kind === 'group'){
    // каждый пункт группы учитывается как отдельный ответ (и в слабых карточках)
    t.parts.forEach((p, pi) => p.rows.forEach((r, ri) => {
      const boxes = [...document.querySelectorAll(`.field[data-id="${pi}.${ri}"]`)];
      const ok = boxes.every(b => b.dataset.res === 'ok');
      const it = ITEMS.find(x => x.g === p.g && x.q === r[0]);
      session.total++; if (ok) session.ok++; if (it) record(it, ok);
    }));
  }
  session.i++;
  if (session.i < session.tasks.length) renderTask(); else showResult();
}

function showResult(){
  const pct = session.total ? Math.round(session.ok / session.total * 100) : 0;
  const bests = store.get('best', {}), k = scopeKey();
  if (bests[k] == null || pct > bests[k]){ bests[k] = pct; store.set('best', bests); }
  $('#rScore').textContent = `${session.ok} / ${session.total}`;
  $('#rPct').textContent = pct + '%';
  $('#rComment').textContent = pct >= 90 ? 'Отлично!' : pct >= 70 ? 'Хорошо, но есть что повторить.' : 'Стоит повторить — ошибки ушли в слабые карточки.';
  const missed = ITEMS.filter(it => session.missed.has(it.id));
  $('#rMenu').innerHTML = `
    <button class="primary" onclick="begin(session.last.map(t => t))"><i>↺</i> Ещё раз <em>›</em></button>
    ${missed.length ? `<button onclick='begin(itemTasks(shuffle(ITEMS.filter(it => ${JSON.stringify([...session.missed])}.includes(it.id)))))'><i>✗</i> Повторить ошибки (${missed.length}) <em>›</em></button>` : ''}
    <button onclick="go('home')"><i>⌂</i> На главную <em>›</em></button>`;
  go('result');
}

/* ============================================================
   КАРТОЧКИ
   ============================================================ */
let deck = { q: [], total: 0, ok: 0, miss: 0 };
function startCards(){
  const items = shuffle(scopeItems());
  if (!items.length){ alert('Нет карточек для выбранного фильтра'); return; }
  deck = { q: items, total: items.length, ok: 0, miss: 0 };
  session.missed = new Set();
  go('cards'); renderCard();
}
function renderCard(){
  $('#cTag').textContent = scopeName();
  if (!deck.q.length){
    $('#cCount').textContent = 'Готово';
    $('#cBar').style.width = '100%';
    $('#cBody').innerHTML = `<div class="res-wrap" style="padding-top:20px"><div class="res-score" style="font-size:40px">${deck.ok} / ${deck.ok + deck.miss}</div>
      <div class="res-pct">знал / всего ответов</div><div class="menu" style="margin-top:24px">
      <button class="primary" onclick="startCards()"><i>↺</i> Ещё раз <em>›</em></button>
      <button onclick="go('home')"><i>⌂</i> На главную <em>›</em></button></div></div>`;
    return;
  }
  const it = deck.q[0], done = deck.total - deck.q.length;
  $('#cCount').textContent = `${done + 1} / ${deck.total}`;
  $('#cBar').style.width = (done / deck.total * 100) + '%';
  const ans = typeof it.a === 'object'
    ? Object.entries(it.a).map(([k, v]) => `<div class="v"><span>${esc(k)}</span>${esc(v)}</div>`).join('') : esc(it.a);
  $('#cBody').innerHTML = `
    <div class="card" id="card" onclick="this.classList.toggle('flip')"><div class="card-in">
      <div class="face"><div class="s">${esc(it.g.title)}</div><div class="q">${esc(it.q)}</div><div class="s">нажмите, чтобы перевернуть</div></div>
      <div class="face back"><div class="s">${esc(it.q)}</div><div class="a">${ans}</div>
        ${it.o.n ? `<div class="n">${esc(it.o.n)}</div>` : ''}<div class="s">${esc(srcOf(it.g, it.o))}${it.o.u ? ' · <span class="unv">⚠ не подтверждено</span>' : ''}</div></div>
    </div></div>
    <div class="row2"><button class="btn ghost" onclick="mark(false)">Не знаю</button><button class="btn" onclick="mark(true)">Знаю</button></div>`;
}
function mark(ok){
  const it = deck.q.shift();
  record(it, ok);
  if (ok) deck.ok++;
  else { deck.miss++; deck.q.splice(Math.min(deck.q.length, 4 + (Math.random() * 3 | 0)), 0, it); deck.total++; }
  renderCard();
}

/* ============================================================
   ШПАРГАЛКА
   ============================================================ */
function showRef(){
  $('#refTag').textContent = SRC[state.src] + ' · ' + scopeName();
  let html = '', last = null;
  scopeGroups().forEach(g => {
    if (g.sec !== last){ html += `<h2>${g.sec} ${esc(SECTIONS[g.sec])}</h2>`; last = g.sec; }
    html += `<h3>${esc(g.title)} · ${esc(g.ref || secLabel(g))}</h3><table>`;
    itemsOf(g).forEach(([q, a, o = {}]) => {
      const v = typeof a === 'object' ? Object.entries(a).map(([k, x]) => `<span class="vv"><span>${esc(k)}</span>${esc(x)}</span>`).join('') : esc(a);
      html += `<tr><td>${esc(q)}${o.u ? ' <span class="unv">⚠</span>' : ''}</td><td>${v}${o.n ? `<small>${esc(o.n)}</small>` : ''}</td></tr>`;
    });
    html += '</table>';
  });
  $('#refBody').innerHTML = html || '<p>Нет данных.</p>';
  go('ref');
}

/* клавиши: карточки — пробел/1/2; тест — Enter */
document.addEventListener('keydown', e => {
  if (!$('#cards').classList.contains('active') || !$('#card')) return;
  if (e.code === 'Space'){ e.preventDefault(); $('#card').classList.toggle('flip'); }
  else if (e.key === '1') mark(false);
  else if (e.key === '2') mark(true);
});

renderHome();
</script>
</body>
</html>
