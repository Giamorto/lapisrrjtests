<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>RRJ-95 Limits</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f4;
    --bg3: #eeece9;
    --text: #1a1a18;
    --text2: #6b6b67;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --green-bg: #eaf3de;
    --green: #3b6d11;
    --red-bg: #fcebeb;
    --red: #a32d2d;
    --radius: 10px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg2: #262624;
      --bg3: #2e2e2b;
      --text: #f0ede8;
      --text2: #8a8a84;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
      --green-bg: #1a2e0a;
      --green: #7fc44e;
      --red-bg: #2e1010;
      --red: #e07070;
    }
  }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 430px;
    margin: 0 auto;
    padding: 0 0 calc(1rem + var(--safe-bottom));
    min-height: 100vh;
  }
  .screen { display: none; }
  .screen.active { display: block; }

  /* Nav header */
  .nav {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 1rem 1rem 0.75rem;
    border-bottom: 0.5px solid var(--border);
  }
  .nav-title { font-size: 17px; font-weight: 600; color: var(--text); }
  .back-btn {
    width: 32px; height: 32px;
    border: none; background: var(--bg2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text);
    font-size: 18px; line-height: 1;
    flex-shrink: 0;
  }
  .back-btn:active { opacity: 0.6; }

  /* Home */
  .home-top {
    padding: 2rem 1rem 1.5rem;
  }
  .home-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 4px;
  }
  .home-title {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }
  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 1rem 1.5rem;
  }
  .stat {
    background: var(--bg2);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat-n { font-size: 26px; font-weight: 600; color: var(--text); letter-spacing: -0.5px; }
  .stat-l { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .menu-list {
    padding: 0 1rem;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .menu-btn {
    width: 100%;
    padding: 15px 16px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
  }
  .menu-btn:active { background: var(--bg2); }
  .menu-btn.primary {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  .menu-btn.primary:active { opacity: 0.85; }
  .menu-icon { font-size: 20px; width: 24px; text-align: center; }
  .menu-btn .arrow { margin-left: auto; color: var(--text2); font-size: 18px; }
  .menu-btn.primary .arrow { color: var(--bg); opacity: 0.5; }

  /* Quiz */
  .quiz-header {
    padding: 1rem 1rem 0.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .q-counter { font-size: 14px; color: var(--text2); font-weight: 500; }
  .cat-tag {
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    background: var(--bg2);
    padding: 3px 10px;
    border-radius: 100px;
  }
  .progress-bar {
    height: 3px;
    background: var(--bg3);
    margin: 0 1rem;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--text);
    border-radius: 2px;
    transition: width 0.35s ease;
  }
  .question-text {
    padding: 1.25rem 1rem 1.5rem;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.35;
    letter-spacing: -0.3px;
  }
  .options {
    padding: 0 1rem;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .opt {
    padding: 15px 16px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    font-weight: 400;
    cursor: pointer;
    text-align: left;
    width: 100%;
  }
  .opt:active:not(:disabled) { background: var(--bg2); }
  .opt.correct { background: var(--green-bg); border-color: var(--green); color: var(--green); font-weight: 500; }
  .opt.wrong   { background: var(--red-bg);   border-color: var(--red);   color: var(--red); }
  .opt.reveal  { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .opt:disabled { cursor: default; }
  .num-area { padding: 0 1rem; }
  .num-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .num-input {
    flex: 1;
    padding: 14px 16px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--bg);
    color: var(--text);
    font-size: 22px;
    font-weight: 600;
    -moz-appearance: textfield;
    appearance: textfield;
    max-width: 180px;
  }
  .num-input::-webkit-outer-spin-button,
  .num-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .num-input:focus { outline: none; border-color: var(--text); }
  .num-unit { font-size: 16px; color: var(--text2); font-weight: 500; }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .kp-btn {
    padding: 16px 0;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--bg2);
    color: var(--text);
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
  }
  .kp-btn:active { background: var(--border2); }
  .kp-minus { color: var(--red); font-size: 26px; }
  .kp-back { font-size: 18px; color: var(--text2); }
  .check-btn {
    width: 100%;
    padding: 15px;
    border-radius: var(--radius);
    border: none;
    background: var(--text);
    color: var(--bg);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .check-btn:active { opacity: 0.8; }
  .check-btn:disabled { opacity: 0.4; cursor: default; }
  .feedback {
    margin: 14px 1rem 0;
    padding: 13px 16px;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.45;
    display: none;
  }
  .feedback.ok { background: var(--green-bg); color: var(--green); }
  .feedback.no { background: var(--red-bg);   color: var(--red); }
  .next-btn {
    margin: 14px 1rem 0;
    width: calc(100% - 2rem);
    padding: 15px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    display: none;
  }
  .next-btn:active { background: var(--bg2); }

  /* Result */
  .result-wrap {
    padding: 2.5rem 1rem 1.5rem;
  }
  .result-label { font-size: 13px; color: var(--text2); font-weight: 500; margin-bottom: 6px; }
  .result-score {
    font-size: 64px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 6px;
  }
  .result-pct { font-size: 20px; color: var(--text2); margin-bottom: 0.5rem; }
  .result-comment { font-size: 16px; color: var(--text2); margin-bottom: 2.5rem; }
  .result-btns { display: flex; flex-direction: column; gap: 10px; }

  /* Import */
  .import-body { padding: 1rem; }
  .import-hint {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .json-textarea {
    width: 100%;
    height: 220px;
    padding: 14px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--bg2);
    color: var(--text);
    font-size: 13px;
    font-family: 'SF Mono', 'Menlo', monospace;
    line-height: 1.5;
    resize: none;
    margin-bottom: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .json-textarea:focus { outline: none; border-color: var(--text); }
  .import-status {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 10px;
    min-height: 20px;
  }
  .import-status.ok { color: var(--green); }
  .import-status.err { color: var(--red); }

  /* Prompt */
  .prompt-body { padding: 1rem; }
  .prompt-box {
    background: var(--bg2);
    border-radius: var(--radius);
    padding: 16px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text2);
    white-space: pre-wrap;
    margin-bottom: 1rem;
    max-height: 50vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    font-family: 'SF Mono', 'Menlo', monospace;
  }
  .copy-btn {
    width: 100%;
    padding: 15px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
  }
  .copy-btn:active { background: var(--bg2); }
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div id="home" class="screen active">
  <div class="home-top">
    <div class="home-label">Тест по ограничениям</div>
    <div class="home-title">RRJ-95 Limits</div>
  </div>
  <div class="stat-row">
    <div class="stat">
      <div class="stat-n" id="stat-total">0</div>
      <div class="stat-l">вопросов</div>
    </div>
    <div class="stat">
      <div class="stat-n" id="stat-best">—</div>
      <div class="stat-l">лучший результат</div>
    </div>
  </div>
  <div class="menu-list">
    <button class="menu-btn primary" onclick="startQuiz(10)">
      <span class="menu-icon">▶</span> 10 случайных вопросов
      <span class="arrow">›</span>
    </button>
    <button class="menu-btn" onclick="startQuiz(20)">
      <span class="menu-icon">▶</span> 20 вопросов
      <span class="arrow">›</span>
    </button>
    <button class="menu-btn" onclick="startQuiz(null)">
      <span class="menu-icon">▶▶</span> Все вопросы
      <span class="arrow">›</span>
    </button>
    <button class="menu-btn" onclick="showScreen('import')">
      <span class="menu-icon">⬆</span> Импорт вопросов
      <span class="arrow">›</span>
    </button>
    <button class="menu-btn" onclick="showScreen('prompt')">
      <span class="menu-icon">✦</span> Промпт для генерации
      <span class="arrow">›</span>
    </button>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="quiz-header">
    <span class="q-counter" id="q-counter">1 / 15</span>
    <span class="cat-tag" id="q-cat"></span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress" style="width:0%"></div>
  </div>
  <p class="question-text" id="q-text"></p>
  <div id="q-body"></div>
  <div class="feedback" id="q-feedback"></div>
  <button class="next-btn" id="next-btn" onclick="nextQ()">Далее →</button>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="result-wrap">
    <div class="result-label">Результат теста</div>
    <div class="result-score" id="res-score"></div>
    <div class="result-pct" id="res-pct"></div>
    <div class="result-comment" id="res-comment"></div>
    <div class="result-btns">
      <button class="menu-btn primary" onclick="startQuiz(lastCount)">
        <span class="menu-icon">↺</span> Ещё раз
        <span class="arrow">›</span>
      </button>
      <button class="menu-btn" onclick="showScreen('home')">
        <span class="menu-icon">⌂</span> На главную
        <span class="arrow">›</span>
      </button>
    </div>
  </div>
</div>

<!-- IMPORT -->
<div id="import" class="screen">
  <div class="nav">
    <button class="back-btn" onclick="showScreen('home')">‹</button>
    <span class="nav-title">Импорт вопросов</span>
  </div>
  <div class="import-body">
    <div class="import-hint">Вставьте JSON с вопросами — получить его можно через промпт для нейронки</div>
    <textarea id="json-text" class="json-textarea" placeholder='[{"id":1,"category":"...","question":"...","type":"choice","options":[...],"answer":0}, ...]' spellcheck="false"></textarea>
    <div class="import-status" id="import-status"></div>
    <button class="menu-btn primary" onclick="loadText()" style="margin-bottom:10px">
      <span class="menu-icon">⬆</span> Загрузить
      <span class="arrow">›</span>
    </button>
    <button class="menu-btn" onclick="showScreen('home')">
      <span class="menu-icon">‹</span> Назад
      <span class="arrow">›</span>
    </button>
  </div>
</div>

<!-- PROMPT -->
<div id="prompt" class="screen">
  <div class="nav">
    <button class="back-btn" onclick="showScreen('home')">‹</button>
    <span class="nav-title">Промпт для нейронки</span>
  </div>
  <div class="prompt-body">
    <div class="prompt-box" id="prompt-box"></div>
    <button class="copy-btn" id="copy-btn" onclick="copyPrompt()">📋 Скопировать промпт</button>
  </div>
</div>

</div>

<script>
const PROMPT = `Ты — генератор тестовых вопросов по Руководству полётной эксплуатации RRJ-95. Прочитай предоставленный текст РЛЭ и создай список вопросов для проверки знаний лётного экипажа.

Формат ответа — только JSON, без каких-либо других слов, без markdown-блоков. Структура:

[
  {
    "id": 1,
    "category": "Масса и центровка",
    "question": "Максимальная взлётная масса (тормоза отпущены)?",
    "type": "number",
    "answer": 49450,
    "unit": "кг",
    "tolerance": 0
  },
  {
    "id": 2,
    "category": "Скорости",
    "question": "Максимальная скорость VMO?",
    "type": "choice",
    "options": ["295 kt", "308 kt", "320 kt", "285 kt"],
    "answer": 1
  }
]

Правила:
- type "number": числовой ответ, поля answer (число), unit (единица), tolerance (допуск ±)
- type "choice": 4 варианта, answer — индекс правильного (0–3)
- category: краткая тема (Масса и центровка / Скорости / Ветровые ограничения / Шасси / Двигатель / ВПП / Автопилот / APU / Топливо)
- Минимум 20 вопросов, охватывай разные разделы
- Вопросы только с конкретными числовыми значениями из РЛЭ
- Не включай вопросы без чёткого однозначного ответа

Текст РЛЭ для обработки:
[ВСТАВИТЬ ТЕКСТ РЛЭ]`;

const DEFAULT_QS = [
  {id:1,category:"Перегрузка",question:"Какова допустимая эксплуатационная маневренная перегрузка при убранных предкрылках и закрылках?",type:"choice",options:["от −0.5 до +2.0 g","от −1.0 до +2.5 g","от −1.5 до +3.0 g","от 0.0 до +2.0 g"],answer:1},
  {id:2,category:"Перегрузка",question:"Какова допустимая эксплуатационная маневренная перегрузка при убранных предкрылках и выпущенных закрылках?",type:"choice",options:["от −1.0 до +2.5 g","от −0.5 до +2.0 g","от 0.0 до +2.0 g","от 0.0 до +1.5 g"],answer:2},
  {id:3,category:"Перегрузка",question:"Какова допустимая эксплуатационная маневренная перегрузка при выпущенных предкрылках и закрылках?",type:"choice",options:["от −1.0 до +2.5 g","от −0.5 до +2.0 g","от 0.0 до +2.0 g","от 0.0 до +1.0 g"],answer:2},
  {id:4,category:"Перегрузка",question:"При какой минимальной отрицательной перегрузке убранные предкрылки и закрылки?",type:"number",answer:-1.0,unit:"g",tolerance:0},
  {id:5,category:"Перегрузка",question:"При какой максимальной положительной перегрузке убранные предкрылки и закрылки?",type:"number",answer:2.5,unit:"g",tolerance:0},
  {id:6,category:"Центровка и масса",question:"Какова минимальная центровка для RRJ-95LR?",type:"number",answer:12,unit:"%",tolerance:0},
  {id:7,category:"Центровка и масса",question:"Какова максимальная центровка для RRJ-95LR?",type:"number",answer:32,unit:"%",tolerance:0},
  {id:8,category:"Центровка и масса",question:"Какова минимальная центровка для RRJ-95B?",type:"number",answer:12,unit:"%",tolerance:0},
  {id:9,category:"Центровка и масса",question:"Какова максимальная центровка для RRJ-95B?",type:"number",answer:36,unit:"%",tolerance:0},
  {id:10,category:"Центровка и масса",question:"Максимальная рулежная масса RRJ-95LR?",type:"number",answer:49650,unit:"кг",tolerance:0},
  {id:11,category:"Центровка и масса",question:"Максимальная взлетная масса RRJ-95LR (тормоза отпущены)?",type:"number",answer:49450,unit:"кг",tolerance:0},
  {id:12,category:"Центровка и масса",question:"Максимальная посадочная масса RRJ-95LR?",type:"number",answer:41000,unit:"кг",tolerance:0},
  {id:13,category:"Центровка и масса",question:"Максимальная масса без топлива RRJ-95LR?",type:"number",answer:40000,unit:"кг",tolerance:0},
  {id:14,category:"Центровка и масса",question:"Минимальная полетная масса RRJ-95LR?",type:"number",answer:27400,unit:"кг",tolerance:0},
  {id:15,category:"Центровка и масса",question:"Максимальная рулежная масса RRJ-95B?",type:"number",answer:46055,unit:"кг",tolerance:0},
  {id:16,category:"Центровка и масса",question:"Максимальная взлетная масса RRJ-95B (тормоза отпущены)?",type:"number",answer:45880,unit:"кг",tolerance:0},
  {id:17,category:"Маневрирование на земле",question:"Максимальная скорость ветра при рулении (N1≤35%)?",type:"number",answer:35,unit:"kt",tolerance:0},
  {id:18,category:"Маневрирование на земле",question:"Максимальная скорость ветра при буксировке?",type:"number",answer:50,unit:"kt",tolerance:0},
  {id:19,category:"Маневрирование на земле",question:"Максимальный угол поворота колес передней опоры при буксировке?",type:"choice",options:["±45°","±65°","±75°","±85°"],answer:3},
  {id:20,category:"Маневрирование на земле",question:"На каком значении установлены датчик и механические свидетели превышения предельного угла поворота колес?",type:"choice",options:["±75°","±85°","±90°","±95°"],answer:2},
  {id:21,category:"Условия эксплуатации",question:"Минимальная допустимая температура на эшелоне?",type:"number",answer:-70,unit:"°C",tolerance:0},
  {id:22,category:"Условия эксплуатации",question:"Максимальная допустимая температура на эшелоне?",type:"number",answer:-32,unit:"°C",tolerance:0},
  {id:23,category:"Условия эксплуатации",question:"Минимальная температура на земле?",type:"number",answer:-54,unit:"°C",tolerance:0},
  {id:24,category:"Условия эксплуатации",question:"Максимальная температура на земле?",type:"number",answer:45,unit:"°C",tolerance:0},

let questions = [...DEFAULT_QS];
let queue = [];
let current = 0;
let score = 0;
let best = null;
let answered = false;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
  updateHomeStats();
}

function updateHomeStats() {
  document.getElementById('stat-total').textContent = questions.length;
  document.getElementById('stat-best').textContent = best !== null ? best + '%' : '—';
}

function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }

let lastCount = 10;

function startQuiz(count) {
  lastCount = count;
  const n = count ? Math.min(count, questions.length) : questions.length;
  queue = shuffle(questions).slice(0, n);
  current = 0; score = 0; answered = false;
  showScreen('quiz');
  renderQ();
}

function renderQ() {
  const q = queue[current];
  answered = false;
  document.getElementById('q-counter').textContent = (current + 1) + ' / ' + queue.length;
  document.getElementById('q-cat').textContent = Array.isArray(q.category) ? q.category.join(', ') : q.category;
  document.getElementById('progress').style.width = (current / queue.length * 100) + '%';
  document.getElementById('q-text').textContent = q.question;
  const fb = document.getElementById('q-feedback');
  fb.style.display = 'none';
  fb.className = 'feedback';
  const nb = document.getElementById('next-btn');
  nb.style.display = 'none';
  const body = document.getElementById('q-body');
  if (q.type === 'choice') {
    body.innerHTML = '<div class="options">' +
      q.options.map((o, i) => `<button class="opt" onclick="checkChoice(${i})">${o}</button>`).join('') +
      '</div>';
  } else {
    body.innerHTML = `<div class="num-area">
      <div class="num-row">
        <input type="text" class="num-input" id="num-ans" inputmode="none" placeholder="0" readonly>
        <span class="num-unit">${q.unit || ''}</span>
      </div>
      <div class="keypad">
        <button type="button" class="kp-btn" onclick="kpInput('1')">1</button>
        <button type="button" class="kp-btn" onclick="kpInput('2')">2</button>
        <button type="button" class="kp-btn" onclick="kpInput('3')">3</button>
        <button type="button" class="kp-btn" onclick="kpInput('4')">4</button>
        <button type="button" class="kp-btn" onclick="kpInput('5')">5</button>
        <button type="button" class="kp-btn" onclick="kpInput('6')">6</button>
        <button type="button" class="kp-btn" onclick="kpInput('7')">7</button>
        <button type="button" class="kp-btn" onclick="kpInput('8')">8</button>
        <button type="button" class="kp-btn" onclick="kpInput('9')">9</button>
        <button type="button" class="kp-btn kp-minus" onclick="kpInput('-')">&minus;</button>
        <button type="button" class="kp-btn" onclick="kpInput('0')">0</button>
        <button type="button" class="kp-btn" onclick="kpInput('.')">.</button>
        <button type="button" class="kp-btn kp-back" onclick="kpBackspace()">⌫</button>
      </div>
      <button class="check-btn" id="check-btn" onclick="checkNumber()">Проверить</button>
    </div>`;
  }
}

function showFeedback(ok, text) {
  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback ' + (ok ? 'ok' : 'no');
  fb.textContent = text;
  fb.style.display = 'block';
  const nb = document.getElementById('next-btn');
  nb.style.display = 'block';
  nb.textContent = current + 1 >= queue.length ? 'Завершить' : 'Далее →';
}

function checkChoice(i) {
  if (answered) return;
  answered = true;
  const q = queue[current];
  const btns = document.querySelectorAll('.opt');
  btns.forEach(b => b.disabled = true);
  if (i === q.answer) {
    btns[i].classList.add('correct');
    score++;
    showFeedback(true, '✓ Верно');
  } else {
    btns[i].classList.add('wrong');
    btns[q.answer].classList.add('reveal');
    showFeedback(false, '✗ Неверно. Правильный ответ: ' + q.options[q.answer]);
  }
}

function kpInput(ch) {
  const inp = document.getElementById('num-ans');
  if (!inp || inp.disabled) return;
  if (ch === '-') {
    inp.value = inp.value.startsWith('-') ? inp.value.slice(1) : '-' + inp.value;
  } else if (ch === '.') {
    if (!inp.value.includes('.')) inp.value += (inp.value === '' || inp.value === '-') ? '0.' : '.';
  } else {
    inp.value += ch;
  }
}

function kpBackspace() {
  const inp = document.getElementById('num-ans');
  if (!inp || inp.disabled) return;
  inp.value = inp.value.slice(0, -1);
}

function checkNumber() {
  if (answered) return;
  const inp = document.getElementById('num-ans');
  if (!inp || inp.value === '') return;
  answered = true;
  const q = queue[current];
  const val = parseFloat(inp.value.replace(',', '.'));
  const tol = q.tolerance || 0;
  const ok = Math.abs(val - q.answer) <= tol;
  inp.disabled = true;
  const cb = document.getElementById('check-btn');
  if (cb) cb.disabled = true;
  if (ok) { score++; showFeedback(true, '✓ Верно: ' + q.answer + ' ' + (q.unit || '')); }
  else { showFeedback(false, '✗ Неверно. Правильный ответ: ' + q.answer + ' ' + (q.unit || '')); }
}

function nextQ() {
  current++;
  if (current >= queue.length) { showResult(); return; }
  renderQ();
  window.scrollTo(0, 0);
}

function showResult() {
  const pct = Math.round(score / queue.length * 100);
  if (best === null || pct > best) best = pct;
  document.getElementById('res-score').textContent = score + ' / ' + queue.length;
  document.getElementById('res-pct').textContent = pct + '%';
  document.getElementById('res-comment').textContent =
    pct >= 90 ? 'Отлично! Ограничения знаешь.' :
    pct >= 70 ? 'Хорошо, есть над чем работать.' :
    pct >= 50 ? 'Нужно повторить материал.' : 'Серьёзно повторить РЛЭ.';
  showScreen('result');
}

function loadText() {
  const raw = document.getElementById('json-text').value.trim();
  const status = document.getElementById('import-status');
  if (!raw) {
    status.className = 'import-status err';
    status.textContent = '✗ Поле пустое — вставьте JSON';
    return;
  }
  try {
    const data = JSON.parse(raw);
    if (!Array.isArray(data)) throw new Error('Должен быть массив JSON');
    if (!data.length) throw new Error('Массив пустой');
    questions = data;
    status.className = 'import-status ok';
    status.textContent = '✓ Загружено вопросов: ' + data.length;
    updateHomeStats();
  } catch (err) {
    status.className = 'import-status err';
    status.textContent = '✗ Ошибка: ' + err.message;
  }
}

function copyPrompt() {
  const btn = document.getElementById('copy-btn');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(PROMPT).then(() => {
      btn.textContent = '✓ Скопировано!';
      setTimeout(() => { btn.textContent = '📋 Скопировать промпт'; }, 2000);
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = PROMPT;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✓ Скопировано!';
    setTimeout(() => { btn.textContent = '📋 Скопировать промпт'; }, 2000);
  }
}

document.getElementById('prompt-box').textContent = PROMPT;

updateHomeStats();
</script>
