<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Отбор вопросов</title>
<style>
:root{
  --bg:#ffffff; --bg2:#f4f4f2; --line:#d6d6d3; --text:#1a1a1a; --muted:#6b6b68;
  --primary:#1a1a1a; --on-primary:#ffffff; --star:#b07800; --sel:#eef4ec; --sel-line:#1d7a46;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --bg2:#202020; --line:#363636; --text:#ececea; --muted:#9a9a96;
    --primary:#ececea; --on-primary:#141414; --star:#f0c060; --sel:#16261b; --sel-line:#5cc98a;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --bg2:#202020; --line:#363636; --text:#ececea; --muted:#9a9a96;
  --primary:#ececea; --on-primary:#141414; --star:#f0c060; --sel:#16261b; --sel-line:#5cc98a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto;padding:20px 16px 110px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:24px;margin:2px 0 6px}
.lead{color:var(--muted);font-size:14px;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.search{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.grp{margin-top:22px}
.gh{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}
.gh b{font-size:16px}
.gh span{font-size:12px;color:var(--muted)}
.gh .deck{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--bg2);color:var(--muted)}
.gh button{margin-left:auto;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;white-space:nowrap}
.q{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.q.on{background:var(--sel);border-color:var(--sel-line)}
.q input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--sel-line)}
.q .t{font-weight:600}
.q .a{font-size:14px;margin-top:3px}
.q .s{font-size:12px;color:var(--muted);margin-top:2px}
.star{color:var(--star);font-size:12px;font-weight:700;margin-left:4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .n{font-weight:700}
.bar .n small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:650;cursor:pointer;background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:var(--bg2);color:var(--text)}
.bar .btn:first-of-type{margin-left:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:14px 14px 0 0;padding:16px;max-height:88vh;display:flex;flex-direction:column;gap:10px}
.sheet textarea{width:100%;flex:1;min-height:300px;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--bg2);color:var(--text);resize:none}
.sheet .row{display:flex;gap:10px}
.sheet .row .btn{flex:1}
.empty{color:var(--muted);text-align:center;padding:30px 0}
</style>
</head>
<body>
<div id="app">
  <div class="label">RRJ-95 Limits</div>
  <h1>Отбор новых вопросов</h1>
  <p class="lead">Отметьте вопросы, которые стоит добавить в тест, и нажмите «Экспорт». Все ответы числовые. ★ — рекомендую в первую очередь.</p>
  <div class="chips" id="chips"></div>
  <input class="search" id="search" placeholder="Поиск по вопросу или источнику">
  <div id="list"></div>
</div>

<div class="bar"><div class="in">
  <div class="n" id="count"></div>
  <button class="btn ghost" onclick="clearSel()">Сбросить</button>
  <button class="btn" onclick="openExport()">Экспорт</button>
</div></div>

<div class="modal" id="modal" onclick="if(event.target===this)closeExport()">
  <div class="sheet">
    <b>Выбранные вопросы в формате теста</b>
    <span style="font-size:13px;color:var(--muted)">Скопируйте и пришлите — я добавлю их в приложение (FCOM — в DEFAULT_QS, SOP — ещё и в SOP_IDS).</span>
    <textarea id="out" readonly></textarea>
    <div class="row">
      <button class="btn" onclick="copyOut()" id="copyBtn">Скопировать</button>
      <button class="btn ghost" onclick="downloadOut()">Скачать .txt</button>
      <button class="btn ghost" onclick="closeExport()">Закрыть</button>
    </div>
  </div>
</div>

const ALL = [];
GROUPS.forEach(g => g.items.forEach((it, i) => { it.key = g.id + ':' + it.q; it.g = g; ALL.push(it); }));
const store = {
  get(k, d){ try{ const v = localStorage.getItem('picker:' + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('picker:' + k, JSON.stringify(v)); }catch(e){} }
};
let sel = new Set(store.get('sel2', []).filter(k => ALL.some(it => it.key === k)));
let filter = 'all', query = '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => String(n).replace('-', '−');
const unit = u => u ? ' ' + u : '';

function preview(it){
  const val = (a, u) => Array.isArray(a) ? `${fmt(a[0])}…${fmt(a[1])}${unit(u)}` : `${fmt(a)}${unit(u)}`;
  if (it.type === 'number') return val(it.a, it.u);
  if (it.type === 'range') return `от ${fmt(it.min)} до ${fmt(it.max)}${unit(it.u)}`;
  if (it.type === 'symmetric') return `±${it.a}${unit(it.u)}`;
  return it.fields.map(([l, a, u]) => `${esc(l)}: <b>${val(a, u)}</b>`).join(' · ');
}

const FILTERS = { all:'Все', fcom:'FCOM', sop:'SOP', star:'★ Рекомендованные', sel:'Выбранные' };
function visible(it){
  if (filter === 'fcom' || filter === 'sop') { if (it.g.deck !== filter) return false; }
  if (filter === 'star' && !it.star) return false;
  if (filter === 'sel' && !sel.has(it.key)) return false;
  if (query){ const s = (it.q + ' ' + it.g.title + ' ' + it.g.src + ' ' + (it.fields || []).map(f => f[0]).join(' ')).toLowerCase(); if (!s.includes(query)) return false; }
  return true;
}

function render(){
  document.getElementById('chips').innerHTML = Object.entries(FILTERS).map(([k, v]) =>
    `<button class="chip ${filter === k ? 'on' : ''}" onclick="setFilter('${k}')">${v}</button>`).join('');
  let html = '';
  GROUPS.forEach(g => {
    const its = g.items.filter(visible);
    if (!its.length) return;
    const allOn = its.every(it => sel.has(it.key));
    html += `<div class="grp"><div class="gh"><b>${esc(g.title)}</b><span class="deck">${g.deck.toUpperCase()}</span><span>${esc(g.src)}</span>
      <button onclick="toggleGroup('${g.id}')">${allOn ? 'снять все' : 'выбрать все'}</button></div>`;
    its.forEach(it => {
      const on = sel.has(it.key);
      html += `<label class="q ${on ? 'on' : ''}"><input type="checkbox" ${on ? 'checked' : ''} onchange="toggle('${it.key}')">
        <div><div class="t">${esc(it.q)}${it.star ? '<span class="star">★</span>' : ''}</div>
        <div class="a">${it.type === 'multi' ? preview(it) : '<b>' + preview(it) + '</b>'}</div></div></label>`;
    });
    html += '</div>';
  });
  document.getElementById('list').innerHTML = html || '<div class="empty">Ничего не найдено</div>';
  const nF = ALL.filter(it => sel.has(it.key) && it.g.deck === 'fcom').length, nS = sel.size - nF;
  document.getElementById('count').innerHTML = `Выбрано ${sel.size} из ${ALL.length}<small>FCOM ${nF} · SOP ${nS}</small>`;
}
function setFilter(k){ filter = k; render(); }
function toggle(key){ sel.has(key) ? sel.delete(key) : sel.add(key); store.set('sel2', [...sel]); render(); }
function toggleGroup(id){
  const its = GROUPS.find(g => g.id === id).items.filter(visible), allOn = its.every(it => sel.has(it.key));
  its.forEach(it => allOn ? sel.delete(it.key) : sel.add(it.key));
  store.set('sel2', [...sel]); render();
}
function clearSel(){ if (sel.size && confirm('Снять все отметки?')){ sel.clear(); store.set('sel2', []); render(); } }
document.getElementById('search').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });

/* ============================================================
   ЭКСПОРТ в формат вопросов старого приложения (DEFAULT_QS)
   ============================================================ */
const FIRST_ID = 330; // в DEFAULT_QS последний id — 329
const js = s => JSON.stringify(s);
function toQuestion(it, id){
  const head = `{id:${id},category:${js(it.g.title)},question:${js(it.q)},`;
  if (it.type === 'number') return head + `type:"number",answer:${it.a},unit:${js(it.u)},tolerance:0}`;
  if (it.type === 'range') return head + `type:"range",answerMin:${it.min},answerMax:${it.max},unit:${js(it.u)},tolerance:0}`;
  if (it.type === 'symmetric') return head + `type:"symmetric",answer:${it.a},unit:${js(it.u)},tolerance:0}`;
  const f = it.fields.map(([l, a, u]) => Array.isArray(a)
    ? `{label:${js(l)},kind:"range",answerMin:${a[0]},answerMax:${a[1]},unit:${js(u)}}`
    : `{label:${js(l)},answer:${a},unit:${js(u)}}`).join(',');
  return head + `type:"multi",fields:[${f}],tolerance:0}`;
}
function exportText(){
  const chosen = ALL.filter(it => sel.has(it.key));
  if (!chosen.length) return '';
  let id = FIRST_ID; const lines = [], sopIds = [];
  chosen.forEach(it => { lines.push(`  ${toQuestion(it, id)}, // ${it.g.src}`); if (it.g.deck === 'sop') sopIds.push(id); id++; });
  return `// Новые вопросы для DEFAULT_QS (${chosen.length} шт.)\n` + lines.join('\n') +
    `\n\n// Добавить в SOP_IDS (колода SOP): ${sopIds.length ? sopIds.join(', ') : '—'}\n`;
}
function openExport(){
  const t = exportText();
  if (!t){ alert('Сначала отметьте вопросы'); return; }
  document.getElementById('out').value = t;
  document.getElementById('modal').classList.add('on');
}
function closeExport(){ document.getElementById('modal').classList.remove('on'); }
function copyOut(){
  const ta = document.getElementById('out'), b = document.getElementById('copyBtn');
  const done = () => { b.textContent = 'Скопировано'; setTimeout(() => b.textContent = 'Скопировать', 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); document.execCommand('copy'); done(); });
  else { ta.select(); document.execCommand('copy'); done(); }
}
function downloadOut(){
  const blob = new Blob([document.getElementById('out').value], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'new_questions.txt'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

render();
</script>
</body>
</html>
