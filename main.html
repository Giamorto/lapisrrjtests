<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест РПП RRJ-95</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Inter, Arial, sans-serif;
    background:#0f172a;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:800px;
    background:#1e293b;
    border-radius:24px;
    padding:32px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.title{
    text-align:center;
    margin-bottom:24px;
}

.title h1{
    font-size:32px;
    margin-bottom:8px;
}

.title p{
    color:#94a3b8;
}

.progress-container{
    background:#334155;
    height:12px;
    border-radius:999px;
    overflow:hidden;
    margin-bottom:30px;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#3b82f6;
    transition:.3s;
}

.counter{
    color:#94a3b8;
    margin-bottom:16px;
}

.question{
    font-size:26px;
    font-weight:600;
    line-height:1.4;
    margin-bottom:24px;
}

.unit{
    color:#94a3b8;
    margin-bottom:12px;
}

input{
    width:100%;
    padding:18px;
    border-radius:14px;
    border:1px solid #475569;
    background:#0f172a;
    color:white;
    font-size:20px;
    outline:none;
}

input:focus{
    border-color:#3b82f6;
}

button{
    width:100%;
    margin-top:24px;
    padding:18px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#1d4ed8;
}

.result{
    text-align:center;
}

.score{
    font-size:64px;
    font-weight:700;
    color:#3b82f6;
}

.percent{
    font-size:28px;
    margin-bottom:20px;
}

.error-card{
    background:#0f172a;
    border:1px solid #334155;
    border-radius:12px;
    padding:16px;
    text-align:left;
    margin-top:12px;
}

.error-card h4{
    color:#ef4444;
    margin-bottom:8px;
}

.correct{
    color:#22c55e;
}

.user{
    color:#f59e0b;
}

@media(max-width:768px){

    .question{
        font-size:20px;
    }

    .score{
        font-size:48px;
    }

    .card{
        padding:20px;
    }
}
</style>

</head>

<body>

<div class="card">

<div id="quiz">

<div class="title">
<h1>Ограничения RRJ-95</h1>
<p>Проверка знаний РПП</p>
</div>

<div class="progress-container">
<div class="progress-bar" id="progress"></div>
</div>

<div class="counter" id="counter"></div>

<div class="question" id="question"></div>

<div class="unit" id="unit"></div>

<input
id="answer"
type="text"
placeholder="Введите ответ"
autocomplete="off"
/>

<button onclick="nextQuestion()">
Далее
</button>

</div>

<div id="result" style="display:none"></div>

</div>

<script>

const questions = [

{
question:"Максимальная эксплуатационная скорость VMO",
answer:"308",
unit:"kt"
},

{
question:"Максимальное число Маха MMO",
answer:"0.81",
unit:""
},

{
question:"Максимальная боковая составляющая ветра на сухой ВПП",
answer:"36",
unit:"kt"
},

{
question:"Максимальная встречная составляющая ветра",
answer:"50",
unit:"kt"
},

{
question:"Максимальная скорость с выпущенным шасси VLE",
answer:"255",
unit:"kt"
},

{
question:"Максимальная скорость выпуска шасси VLO EXT",
answer:"255",
unit:"kt"
},

{
question:"Максимальная скорость уборки шасси VLO RET",
answer:"215",
unit:"kt"
},

{
question:"Максимальная скорость полета с открытой форточкой",
answer:"200",
unit:"kt"
},

{
question:"Максимальная скорость работы стеклоочистителей",
answer:"230",
unit:"kt"
},

{
question:"Максимальный дисбаланс топлива между крыльевыми баками",
answer:"500",
unit:"кг"
}

];

let current = 0;
let score = 0;
let mistakes = [];

function normalize(value){

return value
.toString()
.toLowerCase()
.replace("kt","")
.replace("уз","")
.replace("узлов","")
.replace("кг","")
.replace(/\s+/g,"")
.replace(",",".")
.trim();

}

function loadQuestion(){

document.getElementById("question").innerText =
questions[current].question;

document.getElementById("unit").innerText =
questions[current].unit
? `Ответ в ${questions[current].unit}`
: "";

document.getElementById("counter").innerText =
`Вопрос ${current + 1} из ${questions.length}`;

document.getElementById("progress").style.width =
`${((current)/questions.length)*100}%`;

document.getElementById("answer").value = "";

document.getElementById("answer").focus();
}

function nextQuestion(){

const userAnswer =
document.getElementById("answer").value;

if(userAnswer.trim()===""){
alert("Введите ответ");
return;
}

const correct =
normalize(questions[current].answer);

const user =
normalize(userAnswer);

if(user === correct){

score++;

}else{

mistakes.push({
question:questions[current].question,
correct:questions[current].answer,
user:userAnswer
});

}

current++;

if(current < questions.length){

loadQuestion();

}else{

showResults();

}

}

function showResults(){

document.getElementById("quiz").style.display="none";

const percent =
Math.round((score/questions.length)*100);

let html = `

<div class="result">

<h1>Результат</h1>

<div class="score">
${score}/${questions.length}
</div>

<div class="percent">
${percent}%
</div>

`;

if(mistakes.length){

html += "<h2>Ошибки</h2>";

mistakes.forEach(item=>{

html += `

<div class="error-card">

<h4>${item.question}</h4>

<div class="user">
Ваш ответ: ${item.user}
</div>

<div class="correct">
Правильный ответ: ${item.correct}
</div>

</div>

`;

});

}

html += `

<button onclick="location.reload()">
Пройти заново
</button>

</div>

`;

document.getElementById("result").innerHTML = html;
document.getElementById("result").style.display = "block";

}

loadQuestion();

document
.getElementById("answer")
.addEventListener("keydown",function(e){

if(e.key==="Enter"){
nextQuestion();
}

});

</script>

</body>
</html>
